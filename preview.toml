# local-preview's own preview contract — the canonical example for a repo
# with a Go backend at the root and a Vite frontend in web/. Register this
# repo with itself to preview every commit of the orchestrator.

[frontend]
path  = "web"
image = "node:24-alpine"
build = [["npm", "ci"], ["npm", "run", "build"]]
dist  = "dist"

[backend]
path    = "."
exclude = [
  "docs/",
  "plans/",
  "*.md",
  ".github/",
  ".devcontainer/",
  ".vscode/",
  ".kanban.toml",
  ".pre-commit-config.yaml",
  "compose.yaml",
  "docker-bake.hcl",
  "Dockerfile",
]
image       = "golang:1.26-alpine"
build       = [["go", "build", "-o", "bin/server", "."]]
run         = ["./bin/server", "serve", "--addr", "127.0.0.1:{port}", "--data-dir", "{state_dir}"]
health_path = "/api/health"

# The server binary doubles as the CLI — downloadable per commit from the
# dashboard. Same partition as the backend, but its own content address.
[artifacts.cli]
path    = "."
exclude = [
  "docs/",
  "plans/",
  "*.md",
  ".github/",
  ".devcontainer/",
  ".vscode/",
  ".kanban.toml",
  ".pre-commit-config.yaml",
  "compose.yaml",
  "docker-bake.hcl",
  "Dockerfile",
]
image   = "golang:1.26-alpine"
build   = [["go", "build", "-o", "bin/preview", "."]]
files   = ["bin/preview"]
